apiVersion: v1
kind: Service
metadata:
  name: {{ include "rest-customers.fullname" . }}
  labels:
    {{- include "rest-customers.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "rest-customers.selectorLabels" . | nindent 4 }}